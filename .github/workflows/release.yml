name: Release APK

# Every push to main builds a signed APK and publishes it as a GitHub release.
# Documentation-only changes do not produce a release.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history for the changelog

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compute version
        id: version
        run: |
          base=$(grep '^yummy.version=' gradle.properties | cut -d= -f2)
          version="${base}.${GITHUB_RUN_NUMBER}"
          {
            echo "name=$version"
            echo "code=$GITHUB_RUN_NUMBER"
            echo "tag=v$version"
            echo "apk=YummyAnime-$version.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.YUMMY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "YUMMY_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            # A release signed with a throwaway key could not be updated by later releases, so none is published.
            echo "::warning::Signing secrets are not set: the APK is built as a workflow artifact only, no release is published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          YUMMY_KEYSTORE_PASSWORD: ${{ secrets.YUMMY_KEYSTORE_PASSWORD }}
          YUMMY_KEY_ALIAS: ${{ secrets.YUMMY_KEY_ALIAS }}
          YUMMY_KEY_PASSWORD: ${{ secrets.YUMMY_KEY_PASSWORD }}
          YUMMY_APP_TOKEN: ${{ secrets.YUMMY_APP_TOKEN }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Prepare APK and release notes
        env:
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          APK: ${{ steps.version.outputs.apk }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          apk_sha=$(sha256sum "$APK" | cut -d' ' -f1)
          cert_sha=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" 2>/dev/null \
            | grep -m1 'SHA-256 digest' | awk '{print $NF}')

          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ -n "$previous" ]; then range="$previous..HEAD"; else range="HEAD"; fi
          changes=$(git log --no-merges --pretty="- %s ([\`%h\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/%H))" $range | head -n 50)
          [ -n "$changes" ] || changes="- Rebuild without code changes"
          short_sha=$(git rev-parse --short HEAD)
          build_date=$(date -u +%Y-%m-%d)

          cat > release-notes.md <<NOTES
          **YummyAnime $VERSION** for Android and Android TV, built on $build_date from [\`$short_sha\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          ### Changes
          $changes

          ### Installation
          - **Phone or tablet:** download \`$APK\` below, open it and allow installing apps from this source.
          - **Android TV:** run \`adb install -r $APK\`, or copy the file to the TV (for example with Send Files to TV) and install it with a file manager.
          - Requires Android 7.0 or newer. Installs over the previous version and keeps your login and settings.

          <details><summary>Technical details</summary>

          - versionName \`$VERSION\`, versionCode \`$VERSION_CODE\`
          - APK SHA-256: \`$apk_sha\`
          - Signing certificate SHA-256: \`$cert_sha\`

          </details>
          NOTES
          cat release-notes.md

      - name: Publish GitHub release
        if: steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
          APK: ${{ steps.version.outputs.apk }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of the same workflow run: refresh the asset instead of failing.
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "YummyAnime $VERSION" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              --latest
          fi

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.apk }}
          path: ${{ steps.version.outputs.apk }}
          retention-days: 14
